server:
  port: 8080
  host: 0.0.0.0
  mode: debug

database:
  host: localhost
  port: 5432
  user: postgres
  password: 2024
  name: quiz_craft
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: your-secret-key-change-in-production
  access_token_expire: 24h
  refresh_token_expire: 168h

email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_username: your-email@gmail.com
  smtp_password: your-password
  from_email: noreply@quizcraft.com
  from_name: QuizCraft

app:
  name: QuizCraft
  env: development
  log_level: debug

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization

rate_limit:
  requests: 100
  window: 1m

file_upload:
  max_size: 10485760 # 10MB
  upload_dir: ./uploads
  allowed_types:
    - image/jpeg
    - image/png
    - application/pdf
